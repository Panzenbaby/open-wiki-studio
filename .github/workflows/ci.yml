name: CI

# Pushes to main and every pull request. Version tags are deliberately not
# covered here: release.yml already runs the same gates before it builds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Windows and macOS are release targets (release.yml builds on both), so
    # the test suite has to run there too — path handling is the usual source
    # of platform drift. Type-check and lint are platform-independent and stay
    # on Linux to keep the matrix cheap.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Static type-check (tsc --noEmit)
      - if: matrix.os == 'ubuntu-latest'
        run: npm run check

      # ESLint (flat config, type-aware) — a lint error fails the job
      - if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      # Unit tests (vitest run, exits non-zero on failure)
      - run: npm test
