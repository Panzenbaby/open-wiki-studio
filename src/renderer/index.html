<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:; font-src 'self' data:;" />
    <title>Open Wiki Studio</title>
  </head>
  <body>
    <div id="root">
      <!--
        Pre-React splash: shown instantly while the JS bundle loads and
        React mounts. `createRoot(#root).render()` replaces this content
        on first render, so it never overlaps the real UI. The text is
        localized inline (de/en) because the shared i18n dictionary is
        only available after the bundle loads — values mirror the
        `app.loading` / `app.name` keys in src/shared/i18n.ts. Theme and
        locale come from the localStorage mirror written by
        src/renderer/appearance-cache.ts, because config.json is only
        readable over IPC once the bundle is up.
      -->
      <div id="oks-splash" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0B0E12;color:#8E959E;font-family:'Geist Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
          <img src="./assets/app-icon.png" alt="" width="72" height="72" style="width:72px;height:72px;border-radius:14px;display:block;box-shadow:0 16px 40px rgba(0,0,0,.55);" />
          <span id="oks-splash-name" style="color:#ECEEF0;font-weight:700;font-size:20px;letter-spacing:.01em;">Open Wiki Studio</span>
        </div>
        <div id="oks-splash-loading" style="display:inline-flex;align-items:center;gap:10px;font-size:14px;">
          <span style="display:inline-flex;gap:5px;align-items:center;">
            <span style="width:6px;height:6px;border-radius:50%;background:#D9382C;animation:oks-splash-wave 1.4s ease-in-out infinite;"></span>
            <span style="width:6px;height:6px;border-radius:50%;background:#D9382C;animation:oks-splash-wave 1.4s ease-in-out infinite;animation-delay:.2s;"></span>
            <span style="width:6px;height:6px;border-radius:50%;background:#D9382C;animation:oks-splash-wave 1.4s ease-in-out infinite;animation-delay:.4s;"></span>
          </span>
          <span id="oks-splash-text">Loading…</span>
        </div>
      </div>
      <style>
        @keyframes oks-splash-wave {
          0%, 60%, 100% { transform: translateY(0); opacity: 0.25; }
          30% { transform: translateY(-5px); opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
          #oks-splash-loading span > span { animation: none; opacity: 0.6; }
        }
      </style>
      <script>
        (function () {
          var cached = {};
          try {
            cached = JSON.parse(localStorage.getItem("okf:appearance")) || {};
          } catch (_) { /* no usable mirror — fall back to the system */ }
          try {
            var theme =
              cached.theme === "light" || cached.theme === "dark"
                ? cached.theme
                : window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
            document.documentElement.setAttribute("data-theme", theme);
            if (theme === "light") {
              var splash = document.getElementById("oks-splash");
              if (splash) {
                splash.style.background = "#F5F6F8";
                splash.style.color = "#5F6770";
              }
              var name = document.getElementById("oks-splash-name");
              if (name) name.style.color = "#14181D";
            }
          } catch (_) { /* splash stays dark */ }
          try {
            var locale = cached.locale;
            if (locale !== "de" && locale !== "en") {
              var lang = (typeof navigator !== "undefined" ? navigator.language : "en").toLowerCase();
              locale = lang.indexOf("de") === 0 ? "de" : "en";
            }
            var el = document.getElementById("oks-splash-text");
            if (el) el.textContent = locale === "de" ? "Lade\u2026" : "Loading\u2026";
          } catch (_) { /* splash stays in English */ }
        })();
      </script>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
